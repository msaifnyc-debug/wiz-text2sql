[project]
name = "text2sql-web"
version = "0.1.0"
description = "Text-to-SQL agent as a MongoDB-backed web app (Wiz exercise)"
requires-python = ">=3.11"
dependencies = [
  # web
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.7.1",
  "email-validator==2.1.1",
  "python-multipart==0.0.9",
  "python-jose[cryptography]==3.3.0",
  "bcrypt==4.1.3",
  "jinja2==3.1.4",
  "pymongo==4.7.2",
  # agent (reused from the take-home)
  "openai==1.30.1",
  "sqlglot==30.11.0",
  "python-dotenv==1.0.1",
  "pandas==2.2.2",
  "rich==13.7.1",
]

[project.optional-dependencies]
# httpx is pinned in requirements.txt (runtime); do not re-pin it here or the
# two conflict at install time. The tests do not use httpx/TestClient.
dev = ["pytest==8.2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "web"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
