# ============================================================================
# INTENTIONAL WEAKNESS (required): the application's ServiceAccount is bound to the
# built-in cluster-admin ClusterRole. A compromise of the single internet-facing
# pod therefore means full control of the Kubernetes cluster.
#
# This is the RBAC privilege the Kyverno preventative policy and a CNAPP (Wiz)
# flag as a critical, internet-reachable attack path.
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: text2sql-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: text2sql
    namespace: text2sql
