apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # The Secret is intentionally not a file here; scripts/deploy-app.sh creates it
  # at deploy time from MONGODB_URI / APP_SECRET_KEY / FIREWORKS_API_KEY.

# Placeholder only: scripts/deploy-app.sh swaps in <ecr-url>@<digest> before
# apply, because Kyverno rejects any non-ECR image in this namespace.
images:
  - name: text2sql-app
    newName: text2sql-app
    newTag: latest
