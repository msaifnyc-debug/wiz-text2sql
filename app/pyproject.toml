# Project metadata and pytest configuration only.
#
# Dependency versions live in requirements.txt, which is what the Dockerfile and
# both pipelines install from. They are deliberately NOT duplicated here: a second
# copy drifts, and this file previously still pinned python-jose 3.3.0 and
# openai 1.30.1 after both had been upgraded in requirements.txt.
[project]
name = "text2sql-web"
version = "0.1.0"
description = "Text-to-SQL agent as a MongoDB-backed web app (Wiz exercise)"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["src", "web"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
