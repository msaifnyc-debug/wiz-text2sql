# IaC pipeline: validate + security-scan the Terraform, then plan (PR) / apply (main).
#
# Supply-chain hygiene: every third-party action is pinned to a full commit SHA
# (tag in trailing comment); Dependabot (/.github/dependabot.yml) keeps them patched.
# Cloud auth is keyless via GitHub OIDC -> the IAM role Terraform creates
# (gha_deploy_role_arn); no long-lived AWS keys live in the repo.
name: infra

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  # Required status check (see .github/branch-protection.json).
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      # tfsec + checkov will flag the INTENTIONAL weaknesses (public bucket, open
      # SSH, admin instance role). That is the shift-left demo: findings are
      # surfaced here, pre-deploy. They are soft-fail because the weaknesses are a
      # required, documented part of this exercise (risk explicitly accepted).
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra
          soft_fail: true

      - name: checkov
        uses: bridgecrewio/checkov-action@1855a020a7bf7ca99917817796146c6fd5681230 # v12.2977.0
        with:
          directory: infra
          soft_fail: true
          framework: terraform

  plan:
    if: github.event_name == 'pull_request'
    needs: iac-scan
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      # Numeric IDs for GitHub's immutable OIDC subject claim. Without these the
      # trust policy is rebuilt name-only and the app pipeline's assume breaks.
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: terraform plan
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=wiz-exercise/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_LOCK_TABLE }}"
          terraform -chdir=infra plan -input=false

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: iac-scan
    runs-on: ubuntu-latest
    environment: production # requires manual approval if the env is protected
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      # Numeric IDs for GitHub's immutable OIDC subject claim. Without these the
      # trust policy is rebuilt name-only and the app pipeline's assume breaks.
      TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
      TF_VAR_github_repository_id: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: terraform apply
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=wiz-exercise/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_LOCK_TABLE }}"
          terraform -chdir=infra apply -input=false -auto-approve
