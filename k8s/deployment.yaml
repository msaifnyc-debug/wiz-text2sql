apiVersion: apps/v1
kind: Deployment
metadata:
  name: text2sql
  namespace: text2sql
  labels:
    app: text2sql
spec:
  replicas: 2
  selector:
    matchLabels:
      app: text2sql
  template:
    metadata:
      labels:
        app: text2sql
    spec:
      serviceAccountName: text2sql
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: text2sql
          # Replaced with the ECR digest by scripts/deploy-app.sh.
          image: text2sql-app:latest
          ports:
            - containerPort: 8080
          # Requirement: the MongoDB connection string is a K8s env var (from a Secret).
          envFrom:
            - secretRef:
                name: text2sql-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # App needs writable scratch for uploads + the schema cache; keep the
          # root FS read-only and mount emptyDir for just those paths.
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: cache
              mountPath: /app/.cache
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: uploads
          emptyDir: {}
        - name: cache
          emptyDir: {}
