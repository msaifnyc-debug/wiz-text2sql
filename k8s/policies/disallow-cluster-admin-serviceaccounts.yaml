# ============================================================================
# Flags any ServiceAccount bound to the built-in cluster-admin ClusterRole.
#
# This is the control that was MISSING when the other two policies reported
# "3 pass / 0 fail" on a Deployment whose ServiceAccount holds cluster-admin:
# disallow-privileged checks what a container *asks for*, and
# restrict-image-registries checks where its image *came from*. Neither looks
# at what the workload's identity is *permitted to do*.
#
# Audit, not Enforce: this exercise REQUIRES the app to hold cluster-admin, so
# enforcing would block scripts/deploy-app.sh. Audit still surfaces it in the
# Kyverno policy report (`kubectl get cpolr`). In a real environment this is
# validationFailureAction: Enforce.
#
# Scoped to ServiceAccount subjects on purpose: Kubernetes ships
# cluster-admin -> Group/system:masters and EKS ships
# eks:addon-cluster-admin -> User/eks:addon-manager. Both are legitimate.
# Workload identities are ServiceAccounts, and that is what this catches.
# ============================================================================
#
# Kyverno's reports controller only has read access to the resource kinds the
# Helm chart anticipated, and RBAC objects are not among them. Without this
# aggregated ClusterRole the policy loads and enforces at admission, but the
# background scan cannot read existing bindings, so `kubectl get cpolr` stays
# empty and the already-deployed violation never surfaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:rbac-read
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-cluster-admin-serviceaccounts
  annotations:
    policies.kyverno.io/title: Disallow cluster-admin for ServiceAccounts
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Binding a ServiceAccount to cluster-admin turns any compromise of a pod
      using it into full control of the cluster, including read access to every
      Secret in every namespace.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-cluster-admin-for-serviceaccounts
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
                - RoleBinding
      validate:
        message: >-
          ServiceAccount '{{ request.object.subjects[?kind=='ServiceAccount'].name | [0] }}'
          is bound to cluster-admin via '{{ request.object.metadata.name }}'. A compromise
          of any pod using it means full control of the cluster. Grant a scoped Role
          with only the verbs and resources the workload actually needs.
        deny:
          conditions:
            all:
              - key: "{{ request.object.roleRef.name }}"
                operator: Equals
                value: cluster-admin
              - key: "{{ request.object.subjects[?kind=='ServiceAccount'] | length(@) }}"
                operator: GreaterThan
                value: 0
